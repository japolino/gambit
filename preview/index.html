<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gambit stage preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070605; color: #d8cfbd; font: 12px/1.4 "Segoe UI", system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    #bar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: #0d0b09; border-bottom: 1px solid #2a231b; flex: none; flex-wrap: wrap; }
    #bar select, #bar button { background: #17130f; color: #e6dcc7; border: 1px solid #4a3d2d; padding: 3px 8px; font: inherit; }
    #bar .dim { color: #7d7262; }
    #host { flex: 1; min-height: 0; position: relative; }
  </style>
</head>
<body>
  <div id="bar">
    <strong>Gambit</strong><span class="dim">stage preview</span>
    <select id="enc"></select>
    <button id="reseed">New seed</button>
    <button id="arttest" title="Sends test images through setArt: a cut-out for the moth and the phase-2 boss, an opaque card for the Warden">Test setArt</button>
    <span class="dim" id="info"></span>
  </div>
  <div id="host"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
